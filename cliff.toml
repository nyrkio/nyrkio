# git-cliff config, used by .github/workflows/release.yml (same file in every nyrkio repo).
[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}{% if commit.breaking %} (**breaking**){% endif %} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Keep non-conventional commits (listed under "Other"); only conventional ones drive the version bump.
filter_unconventional = false
split_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge (pull request|branch)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^revert", group = "<!-- 3 -->Reverts" },
  { message = "^(refactor|docs|test|build|ci|chore|style)", group = "<!-- 4 -->Maintenance" },
  { message = ".*", group = "<!-- 5 -->Other" },
]

[bump]
features_always_bump_minor = true
# Below 1.0.0 a breaking change bumps the minor; from 1.0.0 on it bumps the major.
breaking_always_bump_major = false
initial_tag = "v0.1.0"
