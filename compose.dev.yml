services:
  mongodb:
    hostname: mongodb.nyrkio.local
    container_name: mongodb
    image: mongodb/mongodb-community-server:latest
    environment:
      - API_PORT=27017
    ports:
      - "27017:27017"
    command: mongod --quiet --logpath /dev/null

  backend:
    build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8000
      - GIT_SHA=${IMAGE_TAG}
      # Overrides .env.backend. *.localhost = browsers via caddy, backend = the v3 UI server calling us directly
      - CSRF_ALLOWED_HOSTS=${CSRF_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,.localhost}
    ports:
      - "8000:8000"
    hostname: api.nyrkio.local
    depends_on:
      - mongodb
    develop:
      watch:
        - action: rebuild
          path: backend
          ignore:
            - backend/.ruff_cache
            - backend/.pytest_cache

  webhooks:
    build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8080
      - GIT_SHA=${IMAGE_TAG}
    ports:
      - "8080:8080"
    hostname: api.nyrkio.local
    depends_on:
      - mongodb
    develop:
      watch:
        - action: rebuild
          path: backend
          ignore:
            - backend/.ruff_cache
            - backend/.pytest_cache

  worker01:
    build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8081
      - GIT_SHA=${IMAGE_TAG}
    ports:
      - "8081:8081"
    hostname: api.nyrkio.local
    depends_on:
     - mongodb
    develop:
      watch:
        - action: rebuild
          path: backend
          ignore:
            - backend/.ruff_cache
            - backend/.pytest_cache

  caddy:
    build:
      context: ./
      dockerfile: ./caddy/Dockerfile.dev
    environment:
      - DOMAIN
      - UI_DOMAIN
    volumes:
      - caddy_data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: always
    develop:
      watch:
        - action: rebuild
          path: caddy

volumes:
  caddy_data:
