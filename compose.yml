services:
  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/nyrkio/${ENV}/backend:${IMAGE_TAG}
    build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8000
      - GIT_SHA=${IMAGE_TAG}
    restart: ${RESTART_POLICY:-always}
    networks:
      vpcbr:
        ipv4_address: 10.18.0.2
    ports:
      - "8000:8000"
    hostname: api.nyrkio.local

  webhooks:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/nyrkio/${ENV}/backend:${IMAGE_TAG}
    # build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8080
      - GIT_SHA=${IMAGE_TAG}
    restart: ${RESTART_POLICY:-always}
    networks:
      vpcbr:
        ipv4_address: 10.18.0.4
    ports:
      - "8080:8080"
    hostname: api.nyrkio.local

  worker01:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/nyrkio/${ENV}/backend:${IMAGE_TAG}
    # build: backend
    env_file:
      - .env.backend
    environment:
      - API_PORT=8081
      - GIT_SHA=${IMAGE_TAG}
    restart: ${RESTART_POLICY:-always}
    networks:
      vpcbr:
        ipv4_address: 10.18.0.3
    ports:
      - "8081:8081"
    hostname: api.nyrkio.local

  caddy:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/nyrkio/${ENV}/caddy:${IMAGE_TAG}
    build:
      context: ./
      dockerfile: ./caddy/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      UI_DOMAIN: ${UI_DOMAIN:?UI_DOMAIN is required}
      UI_BASIC_AUTH_HASH: ${UI_BASIC_AUTH_HASH:?UI_BASIC_AUTH_HASH is required (bcrypt, see caddy hash-password)}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      vpcbr:
        ipv4_address: 10.18.0.5
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - webhooks
      - worker01
    restart: ${RESTART_POLICY:-always}

volumes:
  caddy_data:
  caddy_config:

networks:
  vpcbr:
    driver: bridge
    ipam:
     config:
       - subnet: 10.18.0.0/16
         gateway: 10.18.0.1
